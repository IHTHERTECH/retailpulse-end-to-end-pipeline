name: CI — dbt Test on Pull Request

on:
  pull_request:
    branches:
      - main
    paths:
      - "dbt_retailpulse/**"
      - ".github/workflows/ci.yml"

jobs:
  dbt-test:
    name: Run dbt tests
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python 3.11 ─────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Install dbt-databricks ─────────────────────────────────────────
      - name: Install dbt-databricks
        run: |
          pip install --upgrade pip
          pip install dbt-databricks==1.12.0

      # ── 4. Write profiles.yml from GitHub Secrets ─────────────────────────
      # profiles.yml is gitignored (contains credentials).
      # We recreate it here from secrets so dbt can connect.
      - name: Write dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          dbt_retailpulse:
            target: ci
            outputs:
              ci:
                type: databricks
                host: ${{ secrets.DATABRICKS_HOST }}
                http_path: ${{ secrets.DATABRICKS_HTTP_PATH }}
                token: ${{ secrets.DATABRICKS_TOKEN }}
                catalog: workspace
                schema: retailpulse_staging
                threads: 4
          EOF

      # ── 5. Install dbt packages ───────────────────────────────────────────
      - name: dbt deps
        working-directory: dbt_retailpulse
        run: dbt deps

      # ── 6. Run dbt tests ──────────────────────────────────────────────────
      - name: dbt test
        working-directory: dbt_retailpulse
        run: dbt test --target ci